[project]
name = "bess-office"
version = "0.1.0"
description = "Transparent battery dispatch model for an SME office building: rule-based peak shaving vs. LP optimization on real PVGIS, ENTSO-E and Liander data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "entsoe-py>=0.8.0",
    "highspy>=1.16.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pvlib>=0.15.2",
    "pyomo>=6.10.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbstripout>=0.9.1",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
